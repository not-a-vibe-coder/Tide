<style>
:root{
  --page:#091618; --deep:#0b2224; --ink:#f2fbf8; --body:#c9dcd8; --grey:#87999a;
  --line:rgba(255,255,255,.1); --foam:#7aeed6; --glow:#16c6a4;
  --sans:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --wide:"Archivo",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--page);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
body{background:var(--page);color:var(--body);font-family:var(--sans);font-size:18px;line-height:1.7;
  padding-left:max(20px, env(safe-area-inset-left,0px));padding-right:max(20px, env(safe-area-inset-right,0px))}
a{color:var(--ink)}
:focus-visible{outline:1px solid var(--foam);outline-offset:3px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--page);z-index:10}

/* soft tide glow behind the hero */
.glow{position:absolute;inset:0 0 auto;height:720px;pointer-events:none;z-index:-1;
  background:radial-gradient(60% 55% at 70% 10%, rgba(22,198,164,.28), transparent 70%),radial-gradient(45% 40% at 10% 0%, rgba(122,238,214,.12), transparent 70%)}

.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;align-items:center;justify-content:space-between;
  max-width:1120px;margin:0 auto;padding-block:18px;background:linear-gradient(var(--page) 60%, transparent)}
.mark{display:flex;align-items:center;gap:9px;font-family:var(--wide);font-weight:800;font-size:16px;color:var(--ink);text-decoration:none;letter-spacing:-.01em}
.mark img{width:24px;height:24px;border-radius:50%;box-shadow:0 0 12px rgba(22,198,164,.35)}
.links{display:flex;gap:28px;font-family:var(--mono);font-size:13px;letter-spacing:.04em}
.links a{text-decoration:none;color:var(--body)}
.links a:hover{color:var(--ink)}

header.hero{max-width:1120px;margin:56px auto 0;display:grid;gap:22px}
.kicker{font-family:var(--mono);font-size:13px;color:var(--foam);letter-spacing:.06em;text-transform:uppercase}
h1{font-family:var(--wide);font-weight:800;font-stretch:112%;color:var(--ink);font-size:clamp(34px,6.4vw,78px);line-height:1.02;letter-spacing:-.015em;text-transform:uppercase;max-width:16ch;text-wrap:balance}
.meta{display:flex;flex-wrap:wrap;gap:8px 22px;font-family:var(--mono);font-size:13px;color:var(--grey)}
.meta a{color:var(--grey)}
.cover{max-width:1120px;margin:40px auto 0;border-radius:22px;overflow:hidden;border:1px solid rgba(122,238,214,.18);box-shadow:0 40px 120px rgba(0,0,0,.5),0 0 80px rgba(22,198,164,.12)}
.cover img{display:block;width:100%;height:auto;aspect-ratio:21/9;object-fit:cover;max-width:100%}

.quick{max-width:1120px;margin:22px auto 0;display:flex;flex-wrap:wrap;gap:10px}
.pill{display:inline-flex;align-items:center;gap:8px;padding:9px 16px;border-radius:999px;border:1px solid rgba(255,255,255,.18);font-family:var(--mono);font-size:13px;color:var(--ink);text-decoration:none;background:rgba(255,255,255,.03)}
.pill:hover{border-color:var(--foam)}
.pill.solid{background:var(--ink);color:var(--page);border-color:var(--ink);font-family:var(--wide);font-weight:800;font-size:14px}
.pill svg{width:15px;height:15px}

article{max-width:700px;margin:64px auto 0;min-width:0}
article > *{min-width:0}
article h2{font-family:var(--wide);font-weight:800;font-stretch:108%;color:var(--ink);font-size:clamp(24px,3.2vw,32px);line-height:1.15;letter-spacing:-.01em;margin:64px 0 16px;text-wrap:balance}
article h2::before{content:"";display:block;width:36px;height:2px;background:var(--foam);margin-bottom:18px;box-shadow:0 0 12px var(--glow)}
article p{margin:0 0 20px}
article strong{color:var(--ink);font-weight:600}
article em{color:var(--grey)}
article ul,article ol{margin:0 0 22px 1.2em;display:grid;gap:10px}
article li::marker{color:var(--foam)}
article a{text-decoration-color:rgba(122,238,214,.5);text-underline-offset:3px}
article a:hover{color:var(--foam)}
article hr{border:0;border-top:1px solid var(--line);margin:48px 0}
article code{font-family:var(--mono);font-size:.84em;color:#d9faf2;background:rgba(122,238,214,.08);border:1px solid rgba(122,238,214,.14);padding:1px 6px;border-radius:6px;overflow-wrap:anywhere}
article pre{margin:0 0 24px;padding:18px 20px;border-radius:14px;background:var(--deep);border:1px solid rgba(122,238,214,.16);overflow-x:auto}
article pre code{background:none;border:0;padding:0;font-size:15px;color:var(--foam);overflow-wrap:normal}
figure{margin:28px 0 32px}
figure img{display:block;max-width:100%;height:auto;margin:0 auto;border-radius:16px;border:1px solid var(--line);box-shadow:0 24px 70px rgba(0,0,0,.45)}
li figure{margin:16px 0}
.tw{overflow-x:auto;margin:0 0 26px;border:1px solid var(--line);border-radius:14px}
table{border-collapse:collapse;width:100%;font-size:15px;min-width:520px}
th,td{text-align:left;padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-family:var(--mono);font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--grey);font-weight:500;background:rgba(255,255,255,.02)}
tr:last-child td{border-bottom:0}

.end{max-width:1120px;margin:96px auto 0;padding:40px 0 calc(48px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);display:flex;flex-wrap:wrap;gap:24px;align-items:center;justify-content:space-between}
.end h3{font-family:var(--wide);font-weight:800;font-stretch:110%;font-size:clamp(22px,3vw,30px);color:var(--ink);text-transform:uppercase;line-height:1.05}
.end .row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.soon{font-family:var(--mono);font-size:13px;color:var(--grey);display:inline-flex;align-items:center;gap:8px}
.soon b{width:7px;height:7px;border-radius:50%;background:var(--foam);box-shadow:0 0 8px var(--glow)}

@media (max-width:640px){
  body{font-size:17px}
  .links{gap:18px;font-size:12px}
  .links .opt{display:none}
  header.hero{margin-top:28px}
  .cover{margin-top:28px;border-radius:16px}
  article{margin-top:44px}
  article h2{margin-top:48px}
}
</style>
</head>
